<style id="perbaikan-tpq">
/* Cetak: konten cetak disalin ke #print-root lewat skrip di bawah */
@media print{
  html,body{overflow:visible!important;height:auto!important;background:#fff!important}
  #print-root .print-section{position:static!important;margin-left:auto!important;margin-right:auto!important}
}
/* Daftar santri: kartu rapi di HP/tablet kecil */
.santri-nama{display:flex;align-items:center;gap:12px;min-width:0}
.santri-nama img{flex:none}
.santri-aksi{display:inline-flex;gap:8px;justify-content:center}
@media screen and (max-width:820px){
  table.tabel-santri{min-width:0!important;width:100%!important;display:block;border:0}
  table.tabel-santri thead{display:none}
  table.tabel-santri tbody{display:block}
  table.tabel-santri tr{display:flex;flex-direction:column;margin:0 0 12px;padding:4px 14px;background:#fff;border:1px solid #e5e7eb!important;border-radius:14px;box-shadow:0 1px 3px #0f172a0f}
  table.tabel-santri td{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 0!important;border:0!important;border-bottom:1px dashed #e8ebf1!important;text-align:right!important;font-size:14px;min-width:0;overflow-wrap:anywhere}
  table.tabel-santri td:last-child{border-bottom:0!important}
  table.tabel-santri td:before{content:attr(data-label);flex:none;max-width:42%;font-size:12px;font-weight:700;color:#64748b;text-align:left}
  table.tabel-santri td.sel-nama{order:-1;justify-content:flex-start;text-align:left!important;font-size:15px;padding:10px 0!important}
  table.tabel-santri td.sel-nama:before{display:none}
  table.tabel-santri td.sel-aksi{justify-content:space-between}
  table.tabel-santri .santri-aksi{gap:10px}
  table.tabel-santri td[colspan]{justify-content:center;text-align:center!important}
  table.tabel-santri td[colspan]:before{display:none}
  .santri-nama img{width:44px;height:44px}
}
</style>

<script>
/* Perbaikan cetak: saat mencetak, #root disembunyikan oleh CSS, sehingga semua
   .print-section yang dirender di dalam #root ikut hilang (halaman kosong).
   Di sini bagian cetak disalin ke #print-root, yang justru ditampilkan saat cetak. */
(function(){
  function bangun(){
    try{
      var r=document.getElementById('root'),p=document.getElementById('print-root');
      if(!r||!p)return;
      var w=document.getElementById('print-clone');
      if(!w){w=document.createElement('div');w.id='print-clone';p.appendChild(w);}
      w.innerHTML='';
      var a=r.querySelectorAll('.print-section');
      for(var i=0;i<a.length;i++){
        if(a[i].parentElement&&a[i].parentElement.closest('.print-section'))continue;
        w.appendChild(a[i].cloneNode(true));
      }
    }catch(e){}
  }
  function bersihkan(){var w=document.getElementById('print-clone');if(w)w.innerHTML='';}
  var asli=window.print.bind(window);
  window.print=function(){bangun();return asli();};
  window.addEventListener('beforeprint',bangun);
  window.addEventListener('afterprint',bersihkan);
})();
</script>
